services:
  user:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: r3f-app
    working_dir: /user
    ports:
      - "5173:5173"
    volumes:
      - ./user:/user
      - /user/node_modules
      - /user/dist
    networks:
      - app_network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin-app
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next
      # 管理画面から scanner-bridge を配信する（/bridge/*）。会場PCのワンライナー起動用
      - ./scanner-bridge:/app/bridge-src:ro
    environment:
      - BRIDGE_SOURCE_DIR=/app/bridge-src
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Windows/macOSのバインドマウントではコンテナへファイル変更通知が届かず、
      # ソースを編集してもNext.jsが再コンパイルしない（古い画面が出続ける）。
      # ポーリングで監視させる
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # USB接続のスキャナ用ローカルブリッジ（ホスト上で `node scanner-bridge/server.js` を起動）。
      # ブラウザから直接叩くため、コンテナ内ではなくホストから見えるURLを指定する
      - NEXT_PUBLIC_SCANNER_BRIDGE_URL=${SCANNER_BRIDGE_URL:-http://localhost:8090}
    networks:
      - app_network
    depends_on:
      - app

  app:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      SWAGGER_URL: ${SWAGGER_URL}
      SWAGGER_STG_URL: ${SWAGGER_STG_URL}
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_PUBLIC_URL: http://localhost:8333
      STORAGE_BUCKET: fireworks
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      # 開発用: APIから直接eSCLでスキャンする接続先（例: http://192.168.1.50、カンマ区切り可）。
      # 本番ではAPIが会場のLANに届かないためこの経路は使わず、会場PCの scanner-bridge が
      # eSCLを担当する。ALLOW_ANY_TARGET は開発時のみ true（設定外のLANアドレスを許可）
      SCANNER_ESCL_URL: ${SCANNER_ESCL_URL:-}
      SCANNER_ESCL_ALLOW_ANY_TARGET: ${SCANNER_ESCL_ALLOW_ANY_TARGET:-true}
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
    working_dir: /app
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs
    command: "server -s3"
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  swagger-ui:
    image: swaggerapi/swagger-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./openapi.yaml:/openapi.yaml
    networks:
      - app_network
    environment:
      SWAGGER_JSON: /openapi.yaml

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  app_network: